name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name=cc-launch_${{ matrix.goos }}_${{ matrix.goarch }}
          if [ "$GOOS" = windows ]; then
            go build -trimpath -ldflags "-s -w" -o cc-launch.exe .
            zip "$name.zip" cc-launch.exe
          else
            go build -trimpath -ldflags "-s -w" -o cc-launch .
            tar -czf "$name.tar.gz" cc-launch
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cc-launch_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            cc-launch_*.tar.gz
            cc-launch_*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cc-launch_*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cc-launch_* --repo "$GITHUB_REPOSITORY" --generate-notes
