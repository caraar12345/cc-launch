name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A push to main whose VERSION has no GitHub release yet is a release build.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: cc-launch_*
          merge-multiple: true
      # Creates tag vX.Y.Z at this commit; notes cover everything since the
      # previous release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" cc-launch_* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --latest
